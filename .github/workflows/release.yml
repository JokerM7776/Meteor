name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: meteor-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, pdo_sqlite, mbstring, openssl
          tools: none
          coverage: none
      - name: Install CGI test runner
        run: sudo apt-get install -y php8.3-cgi
      - name: Lint and test
        run: |
          find . -name '*.php' -not -path './design/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
      - name: Update language index
        # lang/index.json is the catalog sites download from; contributors don't need to edit it.
        run: |
          php bin/lang.php index
          if [ -n "$(git status --porcelain -- lang/index.json)" ]; then
            git config user.name "Meteor Team"
            git config user.email "meteor-team@north1.org"
            git add lang/index.json
            git commit -m "Update language index"
            git push origin HEAD:main || echo "::warning::Could not push lang/index.json. Run php bin/lang.php index and commit it."
          fi
      - name: Build CSS
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.3/tailwindcss-linux-x64 -o "$RUNNER_TEMP/tailwindcss"
          chmod +x "$RUNNER_TEMP/tailwindcss"
          export PATH="$RUNNER_TEMP:$PATH"
          bin/build-css.sh
      - name: Package
        run: |
          # VERSION holds major.minor.0; the patch number counts commits since VERSION last changed,
          # so changing VERSION to 0.3.0 releases 0.3.0, and the pushes after it 0.3.1, 0.3.2 …
          base="$(git log -1 --format=%H "$GITHUB_SHA" -- VERSION)"
          version="$(cut -d. -f1,2 VERSION).$(git rev-list --count "$base..$GITHUB_SHA")"
          echo "$version" > VERSION
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          php bin/package.php
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then echo "v$RELEASE_VERSION is already released."; exit 0; fi
          gh release create "v$RELEASE_VERSION" "dist/meteor-$RELEASE_VERSION.zip" "dist/meteor-$RELEASE_VERSION.zip.sha256" --target "$GITHUB_SHA" --title "Meteor $RELEASE_VERSION" --latest --generate-notes
