name: Check
on:
  pull_request:
permissions:
  contents: read
jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
          tools: none
          coverage: none
      - name: Check language files
        run: php bin/lang.php check
  themes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, pdo_sqlite, mbstring
          tools: none
          coverage: none
      # Untrusted theme PHP runs in the PR's sandboxed runner with a read-only token and no secrets.
      - name: Check theme catalog
        run: php bin/theme.php catalog check --download
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip, curl, pdo_sqlite, mbstring, openssl
          tools: none
          coverage: none
      - name: Install CGI test runner
        run: sudo apt-get install -y php8.3-cgi
      - name: Lint and test
        run: |
          find . -name '*.php' -print0 | xargs -0 -n1 php -l
          php tests/run.php
