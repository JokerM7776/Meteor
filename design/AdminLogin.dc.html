<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meteor Admin — Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f1f5f9}
a{color:#c2410c}a:hover{color:#9a3412}
</style>
</helmet>
<div style="min-height: 800px; background: #f1f5f9; color: #0f172a; font-family: 'Source Sans 3', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box">

<main style="width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 22px; letter-spacing: -0.02em; justify-content: center">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="8" cy="20" r="5" fill="#f97316"></circle><path d="M12 16 L25 3" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"></path><path d="M9 13 L17 5" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.45"></path><path d="M15 19 L23 11" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.45"></path></svg>
Meteor
<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 8px; border-radius: 6px; background: #e2e8f0; color: #334155">Admin</span>
</div>

<form action="/admin/login" method="post" style="display: flex; flex-direction: column; gap: 20px; padding: 32px; border-radius: 16px; background: #ffffff; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px rgba(15,23,42,0.06)">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 26px; letter-spacing: -0.02em; font-weight: 700">Sign in</h1>
<p style="margin: 0; font-size: 15px; color: #475569">Write and translate posts.</p>
</div>

<button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; border: 0; border-radius: 10px; background: #0f172a; color: #ffffff; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="6" r="3.25" stroke="currentColor" stroke-width="1.6" fill="none"></circle><path d="M1.75 17c0-3 2.4-5.25 5.25-5.25 1.2 0 2.3.35 3.2 1" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path><circle cx="14.5" cy="10.5" r="2.25" stroke="#fb923c" stroke-width="1.6" fill="none"></circle><path d="M14.5 12.75V18M14.5 15.5h1.75M14.5 17.5h1.25" stroke="#fb923c" stroke-width="1.6" stroke-linecap="round"></path></svg>Sign in with a passkey</button>
<p style="margin: -8px 0 0; font-size: 13px; line-height: 1.5; color: #475569; text-align: center">Use Touch ID, Face ID, Windows Hello or a security key.</p>

<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #475569"><span style="flex: 1; height: 1px; background: #e2e8f0"></span>or use your password<span style="flex: 1; height: 1px; background: #e2e8f0"></span></div>

<div role="alert" style="display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; font-size: 14px; line-height: 1.45">
<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" style="flex: 0 0 auto; margin-top: 1px"><circle cx="9" cy="9" r="7.25" stroke="currentColor" stroke-width="1.5" fill="none"></circle><path d="M9 5.5v4M9 12.25v.25" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></path></svg>
That username and password don’t match. Try again.
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="username" style="font-size: 14px; font-weight: 600">Username</label>
<input id="username" name="username" type="text" autocomplete="username webauthn" value="editor" style="height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid #cbd5e1; background: #ffffff; font: inherit; font-size: 16px; color: #0f172a; box-sizing: border-box">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="password" style="font-size: 14px; font-weight: 600">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" value="••••••••••" style="height: 48px; padding: 0 14px; border-radius: 10px; border: 2px solid #0f172a; background: #ffffff; font: inherit; font-size: 16px; color: #0f172a; box-sizing: border-box">
</div>
<input type="hidden" name="csrf_token" value="[CSRF TOKEN]">
<button type="submit" style="height: 48px; border: 1px solid #cbd5e1; border-radius: 10px; background: #ffffff; color: #0f172a; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Sign in with password</button>
</form>

<a href="/en/" style="align-self: center; display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; color: #475569; text-decoration: none">← Back to the site</a>
</main>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
